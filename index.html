<!DOCTYPE html>
<html lang="en">
<head>

  <title>Hero Layout Concept</title>
  <link rel="stylesheet" href="./styles/main.css">
  <script src="./scripts/service-card.js" defer> 
</head>
<body>
  <heading>
    <div class="heading-logo-wrapper">
      <img>
    </div>
    <div>
      <nav>
      </nav>
    </div>
  </heading>

  <section id="hero">
    <img id="hero-image"></img>
    <div id="hero-content">
      <div class="hero-number">(978) 332-6754</div>

      <button class="btn-primary">Primary Action</button>
      <button class="btn-sec">Secondary Action</button>

  </section>

  <section id="introduction">
    <div>
      <h2> Main Intro Content</h2>
      <p>
        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.
      </p>
    </div>
    <div>
      <img>
    </div>
  </section>

  <section >
    <div id="services-track">
      <!-- generated dynamically via javascript-->
    </div>
  </section>

  <!-- ------ FOOTER SECTION ------ -->
  <footer>
    <div style="background-color: #222; color: #fff; padding: var(--padding-m);">Footer Col 1</div>
    <div style="background-color: #333; color: #fff; padding: var(--padding-m);">Footer Col 2</div>
    <div style="background-color: #444; color: #fff; padding: var(--padding-m);">Footer Col 3</div>
    <div style="background-color: #555; color: #fff; padding: var(--padding-m);">Footer Col 4</div>
  </footer>

</body>
</html>

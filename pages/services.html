<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Layout Concept</title>
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/service.css">
   <script src="../scripts/service-card.js" defer></script>
</head>
<body>
  <heading>
    <div class="heading-logo-wrapper">
      <img src="../assets/arrant_logo.jfif">
    </div>
    <div class="heading-content-wrapper">
      <nav id="header-nav">
        <a href="../index.html" class="sd-hover">Main</a>
        <a class="cl-hover">About Us</a>
        <a href="../pages/services.html" class="vm-hover">Services</a>
        <a class="ssr-hover">Contact Us</a>
      </nav>
      <button id="header-btn" class="btn-primary">Get A Quote!</button>
    </div>
  </heading>
  
  <section>
    <div class="service-page-container">
      <div class="service-search-system">
        <div class="search-bar">
          <form role="search" action="/search" method="GET" class="search-form">
            <div class="search-input-group">
              <label for="site-search" class="visually-hidden">Search the site</label>
              <input 
                type="search" 
                id="site-search" 
                name="q" 
                placeholder="Search..." 
                aria-label="Search through site content"
                required
              >
            </div>
            <button type="submit">Search</button>
          </form>
        </div>
        <div class="category-search">
          <!-- Generated dynamically via JavaScript -->
        </div>
      </div>

      <div class="service-search-results">
        <div class="current-search">
          <!-- Generated dynamically using JavaScript -->
        </div>
        
        <div id="services-track">
            <!-- Generated dynamically using JavaScript-->
        </div>
      </div>
  </section>

  <!-- ------ FOOTER SECTION ------ -->
  <footer>
    <div style="background-color: #222; color: #fff; padding: var(--padding-m);">Footer Col 1</div>
    <div style="background-color: #333; color: #fff; padding: var(--padding-m);">Footer Col 2</div>
    <div style="background-color: #444; color: #fff; padding: var(--padding-m);">Footer Col 3</div>
    <div style="background-color: #555; color: #fff; padding: var(--padding-m);">Footer Col 4</div>
  </footer>

</body>
</html>
